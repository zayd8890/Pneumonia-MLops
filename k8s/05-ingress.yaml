# Routes host traffic (via the k3d load balancer on localhost:8081) to the api Service.
# k3s ships Traefik as its default ingress controller - no extra install needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: pneumonia-mlops
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
