# The FastAPI serving app. Image comes from GHCR (built + pushed by .github/workflows/cd.yml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pneumonia-mlops
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api
          image: ghcr.io/zayd8890/pneumonia-mlops:latest
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
          # startupProbe holds off readiness/liveness checks until the app has
          # started once. Needed because startup can take 60-90s in the worst case
          # (MLflow unreachable -> retries with backoff before falling back) -
          # without this, livenessProbe was killing the container mid-startup.
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pneumonia-mlops
spec:
  selector: {app: api}
  ports:
    - port: 8000
      targetPort: 8000
