# Postgres credentials.
#
# DO NOT `kubectl apply -f` this file directly for a real deployment - it has no
# real values committed on purpose (this repo is public). Create the actual
# Secret one of these ways instead:
#
#   kubectl create secret generic postgres-credentials -n pneumonia-mlops \
#     --from-literal=POSTGRES_USER=mlflow \
#     --from-literal=POSTGRES_PASSWORD=<a real password> \
#     --from-literal=POSTGRES_DB=mlflow
#
#   # or, for local k3d testing only, substitute into this template and apply that:
#   envsubst < k8s/01-postgres-secret.yaml | kubectl apply -f -
#
# For a real cloud deployment, use your provider's secret manager (plan.txt names
# AWS Secrets Manager) with the External Secrets Operator instead of a plain Secret.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: pneumonia-mlops
type: Opaque
stringData:
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
