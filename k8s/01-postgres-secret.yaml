# Postgres credentials, as a Secret instead of hardcoded env vars (docker-compose.yml
# used plain env vars for local dev; this is the more realistic k8s pattern).
# NOTE: these are the same learning-project placeholder values as docker-compose.yml -
# not real secrets. Rotate before using this manifest anywhere that matters.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: pneumonia-mlops
type: Opaque
stringData:
  POSTGRES_USER: mlflow
  POSTGRES_PASSWORD: mlflow
  POSTGRES_DB: mlflow
