# Terminates HTTPS, serves the static web app, and reverse-proxies /api/ to
# the FastAPI service. Self-signed cert - fine for local dev, swap for a real
# cert (Let's Encrypt etc.) before this ever faces the internet.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    client_max_body_size 20M;  # x-ray images can be a few MB

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # /api/predict -> http://api:8000/predict (location prefix is stripped by
    # proxy_pass having its own path component)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
