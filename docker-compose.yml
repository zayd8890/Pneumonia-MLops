# Local stack: Postgres (MLflow metadata) + MLflow tracking/registry server + the API,
# plus Prometheus + Grafana for monitoring.
#
# Run:       docker compose up --build
# API:       http://localhost:8000/docs
# MLflow:    http://localhost:5001
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000  (login: admin / admin, dashboard auto-loaded)
#
# select_model.py / train.py / evaluate.py run outside Compose (on your machine, with a
# GPU) - point them at the server with:  set MLFLOW_TRACKING_URI=http://localhost:5001

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5000"   # host:container - 5001 to avoid clashing with a local MLflow UI on 5000
    volumes:
      - mlflow_artifacts:/mlartifacts

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      # Registered model versions store a raw filesystem path (e.g. /mlartifacts/...)
      # pointing inside the mlflow container's artifact root - api needs the same
      # volume mounted at the same path to read those files directly.
      - mlflow_artifacts:/mlartifacts:ro

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
