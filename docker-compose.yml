# Local stack: Postgres (MLflow metadata) + MLflow tracking/registry server + the API.
#
# Run:    docker compose up --build
# API:    http://localhost:8000/docs
# MLflow: http://localhost:5001
#
# select_model.py / train.py / evaluate.py run outside Compose (on your machine, with a
# GPU) - point them at the server with:  set MLFLOW_TRACKING_URI=http://localhost:5001

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5000"   # host:container - 5001 to avoid clashing with a local MLflow UI on 5000
    volumes:
      - mlflow_artifacts:/mlartifacts

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  mlflow_artifacts:
