# ==============================================================================
# Pneumonia Classification MLOps Configuration
# ==============================================================================

# Model Architecture Configuration
model:
  # Supported architectures:
  #   DenseNet family: 'densenet121', 'densenet169', 'densenet201', 'densenet264'
  #   ResNet family:   'resnet18', 'resnet34', 'resnet101'
  architecture: "densenet201"
  num_classes: 2
  in_channels: 3
  class_names:
    - "NORMAL"
    - "PNEUMONIA"
  # Optional path to pretrained weights (.pth) for evaluation or transfer learning
  weights_path: null

# Dataset & DataLoader Configuration
data:
  # Base directory for datasets
  data_dir: "data"
  train_dir: "data/train"
  val_dir: "data/val"
  test_dir: "data/test"
  
  # Image transformation parameters
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  
  # DataLoader parameters
  batch_size: 32
  num_workers: 4
  pin_memory: true

# Training Hyperparameters
training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer: "adam"            # 'adam' or 'sgd'
  loss_function: "cross_entropy" # 'cross_entropy' or 'bce'
  device: "auto"               # 'auto', 'cuda', or 'cpu'
  save_dir: "models"
  checkpoint_prefix: "pneumonia_model"
  save_best_only: true

# Evaluation Configuration
evaluation:
  batch_size: 32
  results_dir: "results"
  save_predictions_csv: true
  save_metrics_json: true

# Inference Configuration
inference:
  device: "auto"
  results_dir: "results"

# Experiment Tracking (MLflow)
mlflow:
  enabled: true
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "pneumonia-classification"
