# mypy configuration.
#
# Scoped to the files this cleanup pass actually got clean: app/, select_model.py,
# src/tracking/. The rest of src/ (models, data, evaluation, training, inference) and
# train.py/evaluate.py mirror the project notebooks closely and have pre-existing type
# issues out of scope for this pass - see ruff.toml for the same pattern applied to
# linting. Widen `files` below as those get cleaned up.

[mypy]
files = app, select_model.py, src/tracking
ignore_missing_imports = True
# Don't report errors from modules outside `files` that select_model.py/app import
# transitively (src/models, src/data, etc.) - those are the out-of-scope files above.
follow_imports = silent
