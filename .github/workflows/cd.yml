name: CD

# Builds the API image and pushes it to GitHub Container Registry (GHCR) whenever
# CI has passed on master. This only produces a versioned, pullable image - it does
# not deploy anywhere yet (no cluster exists to deploy to). That's the next step.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # Only run if the CI workflow that triggered this actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute lowercase image name
        # Docker/GHCR require lowercase repo names; github.repository preserves the
        # repo's actual case (zayd8890/Pneumonia-MLops), so it can't be used directly.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not yet pushed) for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          severity: CRITICAL,HIGH
          exit-code: "0"   # report only for now; flip to "1" once the image is clean enough to enforce
          format: table

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
